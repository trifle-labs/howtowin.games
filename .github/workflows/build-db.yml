name: build-db

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _scripts/requirements.txt

      - run: pip install -r _scripts/requirements.txt

      - name: Cache embeddings
        uses: actions/cache@v4
        with:
          path: _cache/embeddings.sqlite
          key: embeddings-bge-small-en-v1.5-${{ hashFiles('games/**/*.md', 'references.md', 'lexicon/**/*.md', '_scripts/build_db.py', '_scripts/embed.py') }}
          restore-keys: |
            embeddings-bge-small-en-v1.5-

      - name: Cache fastembed model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - run: python _scripts/build_db.py
      - run: python _scripts/embed.py
      - run: python _scripts/categories.py
      - run: python _scripts/export_site_data.py

      - name: Copy content for site
        run: |
          mkdir -p site/games site/lexicon
          cp games/*.md site/games/
          cp lexicon/*.md site/lexicon/
          cp references.md CONTRIBUTING.md site/

      - uses: actions/upload-artifact@v4
        with:
          name: howtowin-db
          path: howtowin.db
          retention-days: 90

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view db-latest >/dev/null 2>&1; then
            gh release edit db-latest \
              --notes "Auto-generated from commit ${{ github.sha }}. Schema: bge-small-en-v1.5 (384-dim)."
            gh release upload db-latest howtowin.db --clobber
          else
            gh release create db-latest howtowin.db \
              --title "Database (latest)" \
              --notes "Auto-generated from commit ${{ github.sha }}. Schema: bge-small-en-v1.5 (384-dim)."
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
