name: build-db

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _scripts/requirements.txt

      - run: pip install -r _scripts/requirements.txt

      - name: Cache embeddings
        uses: actions/cache@v4
        with:
          path: _cache/embeddings.sqlite
          key: embeddings-bge-small-en-v1.5-${{ hashFiles('games/**/*.md', 'references.md', 'lexicon/**/*.md', '_scripts/build_db.py', '_scripts/embed.py') }}
          restore-keys: |
            embeddings-bge-small-en-v1.5-

      - name: Cache fastembed model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - run: python _scripts/build_db.py
      - run: python _scripts/embed.py

      - uses: actions/upload-artifact@v4
        with:
          name: howtowin-db
          path: howtowin.db
          retention-days: 90

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete db-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create db-latest howtowin.db \
            --title "Database (latest)" \
            --notes "Auto-generated from commit ${{ github.sha }}. Schema and embedding model: BAAI/bge-small-en-v1.5 (384-dim)."
